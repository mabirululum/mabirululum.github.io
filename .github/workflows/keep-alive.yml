name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'  # jalan tiap 3 hari sekali, jam 03:00 UTC (≈10:00 WIB)
  workflow_dispatch:         # supaya bisa dites manual kapan saja lewat tombol Run workflow

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/guru?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
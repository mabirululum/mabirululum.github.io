<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Admin Presensi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div class="admin-shell">

    <nav class="sidebar">
      <div class="sidebar-brand"><i class="bi bi-qr-code-scan"></i> Presensi Admin</div>
      <div class="sidebar-nav">
        <a href="dashboard.html" data-roles="admin,piket" class="active"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="izin.html" data-roles="admin,piket"><i class="bi bi-calendar-x"></i> Izin / Sakit</a>
        <a href="guru.html" data-roles="admin"><i class="bi bi-person-badge"></i> Data Guru</a>
        <a href="user.html" data-roles="admin"><i class="bi bi-people"></i> Data User</a>
        <a href="laporan.html" data-roles="admin"><i class="bi bi-bar-chart-line"></i> Laporan</a>
      </div>
      <div class="sidebar-foot">
        <a href="#" onclick="AUTH.logout(); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </nav>

    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger"><i class="bi bi-list"></i></button>
        <h1>Dashboard</h1>
      </div>
      <div class="topbar-user">
        <div class="avatar" id="avatar-admin">A</div>
        <span>Halo, <strong id="nama-admin">-</strong></span>
      </div>
    </header>

    <main class="admin-content">
      <div class="stat-grid">
        <div class="stat-card">
          <div class="num" id="stat-total">0</div>
          <div class="label"><i class="bi bi-check2-square"></i> Total Presensi Hari Ini</div>
        </div>
        <div class="stat-card warn">
          <div class="num" id="stat-telat">0</div>
          <div class="label"><i class="bi bi-clock-history"></i> Telat</div>
        </div>
        <div class="stat-card danger">
          <div class="num" id="stat-pulang-awal">0</div>
          <div class="label"><i class="bi bi-box-arrow-left"></i> Pulang Awal</div>
        </div>
        <div class="stat-card warn">
          <div class="num" id="stat-izin">0</div>
          <div class="label"><i class="bi bi-calendar-x"></i> Sakit/Izin/Kegiatan Hari Ini</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="bi bi-clock-history"></i> Riwayat Presensi Hari Ini</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nama Guru</th><th>Jam Masuk</th><th>Jam Pulang</th><th>Status</th></tr></thead>
            <tbody id="tbody-dashboard"><tr><td colspan="4">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db-adapter.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>

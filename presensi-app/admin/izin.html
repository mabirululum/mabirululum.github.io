<body>
  <div class="admin-shell">
    <nav class="sidebar">
      <div class="sidebar-brand"><i class="bi bi-qr-code-scan"></i> Presensi Admin</div>
      <div class="sidebar-nav">
        <a href="dashboard.html" data-roles="admin"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="izin.html" class="active" data-roles="admin,piket"><i class="bi bi-calendar-x"></i> Izin / Sakit</a>
        <a href="guru.html" data-roles="admin"><i class="bi bi-person-badge"></i> Data Guru</a>
        <a href="user.html" data-roles="admin"><i class="bi bi-people"></i> Data User</a>
        <a href="laporan.html" data-roles="admin"><i class="bi bi-bar-chart-line"></i> Laporan</a>
      </div>
      <div class="sidebar-foot">
        <a href="#" onclick="AUTH.logout(); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </nav>

    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger"><i class="bi bi-list"></i></button>
        <h1>Izin / Sakit</h1>
      </div>
      <div class="topbar-user">
        <div class="avatar" id="avatar-admin">A</div>
        <span>Halo, <strong id="nama-admin">-</strong></span>
      </div>
    </header>

    <main class="admin-content">
      <div class="card">
        <div class="card-title"><i class="bi bi-calendar-plus"></i> Catat Izin / Sakit Guru</div>
        <form id="form-izin">
          <div class="form-row">
            <label>Guru<select id="izin-guru" required></select></label>
            <label>Tanggal<input type="date" id="izin-tanggal" required></label>
            <label>Jenis
              <select id="izin-jenis">
                <option>Sakit</option>
                <option>Izin</option>
                <option>Kegiatan</option>
              </select>
            </label>
          </div>
          <div class="form-row">
            <label>Keterangan (opsional)<input type="text" id="izin-keterangan" placeholder="Contoh: Rapat dinas luar"></label>
          </div>
          <button type="submit" class="btn"><i class="bi bi-save"></i> Simpan</button>
        </form>
      </div>

      <div class="card">
        <div class="card-title"><i class="bi bi-list-ul"></i> Riwayat Izin (Semua Data)</div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Tanggal</th><th>Nama Guru</th><th>Jenis</th><th>Keterangan</th><th>Aksi</th></tr></thead>
            <tbody id="tbody-izin"><tr><td colspan="5">Memuat…</td></tr></tbody>
          </table>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:14px;">
          <span id="info-halaman" style="font-size:12px; color:var(--muted);">-</span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn btn-secondary btn-sm" id="btn-prev"><i class="bi bi-chevron-left"></i> Sebelumnya</button>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-next">Selanjutnya <i class="bi bi-chevron-right"></i></button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db-adapter.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-izin.js"></script>
</body>
</html>

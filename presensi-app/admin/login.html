<body>
  <div class="admin-login-shell">
    <div class="admin-login-card">
      <div class="login-icon"><i class="bi bi-shield-lock-fill"></i></div>
      <h2>Login Admin</h2>
      <p class="login-subtitle">Masuk ke Dashboard Utama Administrator Presensi</p>

      <div class="error-box" id="login-error"></div>

      <form id="form-login">
        <label for="input-username">Username</label>
        <input type="text" id="input-username" placeholder="Masukkan username admin" autocomplete="username" required>

        <label for="input-password">Password</label>
        <input type="password" id="input-password" placeholder="Masukkan password" autocomplete="current-password" required>

        <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right"></i> Masuk ke Dashboard</button>
      </form>

      <div class="login-footer">
        <a href="../index.html"><i class="bi bi-arrow-left"></i> Kembali ke halaman scanner</a>
      </div>
    </div>
  </div>

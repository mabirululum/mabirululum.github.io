<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Admin - Presensi</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body style="overflow:auto;">
  <div class="login-shell">
    <div class="login-card">
      <h2><i class="bi bi-qr-code-scan"></i> Login Admin</h2>

      <div class="mode-switch">
        <button id="btn-mode-form" class="active"><i class="bi bi-key"></i> Username &amp; Password</button>
        <button id="btn-mode-barcode"><i class="bi bi-upc-scan"></i> Scan Barcode</button>
      </div>

      <div class="error-box" id="login-error"></div>

      <div id="panel-form">
        <form id="form-login">
          <input type="text" id="input-username" placeholder="Username" required>
          <input type="password" id="input-password" placeholder="Password" required>
          <button type="submit" class="btn"><i class="bi bi-box-arrow-in-right"></i> Masuk</button>
        </form>
      </div>

      <div id="panel-barcode" style="display:none;">
        <div id="camera-login" style="width:100%;"></div>
        <p style="font-size:12px;color:var(--muted);text-align:center;">Arahkan kartu barcode admin ke kamera</p>
      </div>

      <p style="text-align:center;font-size:12px;margin-top:16px;">
        <a href="../index.html" style="color:var(--muted);">&larr; Kembali ke halaman scanner</a>
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db-adapter.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>

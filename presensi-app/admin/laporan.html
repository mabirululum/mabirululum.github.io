<body>
  <div class="admin-shell">

    <nav class="sidebar">
      <div class="sidebar-brand"><i class="bi bi-qr-code-scan"></i> Presensi Admin</div>
      <div class="sidebar-nav">
        <a href="dashboard.html" data-roles="admin"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="izin.html" data-roles="admin,piket"><i class="bi bi-calendar-x"></i> Izin / Sakit</a>
        <a href="guru.html" data-roles="admin"><i class="bi bi-person-badge"></i> Data Guru</a>
        <a href="user.html" data-roles="admin"><i class="bi bi-people"></i> Data User</a>
        <a href="laporan.html" data-roles="admin" class="active"><i class="bi bi-bar-chart-line"></i> Laporan</a>
      </div>
      <div class="sidebar-foot">
        <a href="#" onclick="AUTH.logout(); return false;"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </nav>

    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-hamburger"><i class="bi bi-list"></i></button>
        <h1>Laporan Presensi</h1>
      </div>
      <div class="topbar-user">
        <div class="avatar" id="avatar-admin">A</div>
        <span>Halo, <strong id="nama-admin">-</strong></span>
      </div>
    </header>

    <main class="admin-content">

      <div class="card">
        <div class="card-title"><i class="bi bi-funnel"></i> Filter Laporan</div>
        <div class="form-row">
          <label>Dari Tanggal<input type="date" id="filter-dari"></label>
          <label>Sampai Tanggal<input type="date" id="filter-sampai"></label>
          <label>Guru<select id="filter-guru"><option value="">Semua Guru</option></select></label>
          <label>Status
            <select id="filter-status">
              <option value="">Semua Status</option>
              <option value="telat">Telat</option>
              <option value="pulang_awal">Pulang Awal</option>
              <option value="alpha">Alpha</option>
              <option value="belum_pulang">Belum Scan Pulang</option>
              <option value="sakit">Sakit</option>
              <option value="izin">Izin</option>
              <option value="kegiatan">Kegiatan</option>
            </select>
          </label>
        </div>
        <button class="btn" id="btn-tampilkan"><i class="bi bi-search"></i> Tampilkan</button>
        <button class="btn btn-secondary" id="btn-export"><i class="bi bi-file-earmark-excel"></i> Export Excel</button>
      </div>

      <div class="stat-grid">
        <div class="stat-card">
          <div class="num" id="stat-total">0</div>
          <div class="label"><i class="bi bi-check2-square"></i> Total Presensi</div>
        </div>
        <div class="stat-card warn">
          <div class="num" id="stat-telat">0</div>
          <div class="label"><i class="bi bi-clock-history"></i> Telat</div>
        </div>
        <div class="stat-card danger">
          <div class="num" id="stat-pulang-awal">0</div>
          <div class="label"><i class="bi bi-box-arrow-left"></i> Pulang Awal</div>
        </div>
        <div class="stat-card alpha">
          <div class="num" id="stat-alpha">0</div>
          <div class="label"><i class="bi bi-exclamation-circle"></i> Alpha</div>
        </div>
        <div class="stat-card izin">
          <div class="num" id="stat-izin">0</div>
          <div class="label"><i class="bi bi-calendar-x"></i> Sakit/Izin/Kegiatan</div>
        </div>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Tanggal</th><th>Nama Guru</th><th>Jam Masuk</th><th>Keterangan Masuk</th><th>Jam Pulang</th><th>Keterangan Pulang</th></tr>
            </thead>
            <tbody id="tbody-laporan"><tr><td colspan="6">Memuat…</td></tr></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/db-adapter.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin-laporan.js"></script>
</body>
</html>

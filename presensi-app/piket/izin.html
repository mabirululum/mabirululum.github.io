<body class="portal-body">

  <!-- ===== TOPBAR (no sidebar) ===== -->
  <header class="piket-topbar">
    <div class="piket-topbar-left">
      <div class="topbar-icon"><i class="bi bi-clipboard-check"></i></div>
      <h1>Piket — Izin / Sakit</h1>
    </div>
    <div class="piket-topbar-right">
      <div class="piket-user-info">
        <div class="avatar" id="avatar-piket">P</div>
        <span>Halo, <strong id="nama-piket">-</strong></span>
      </div>
      <button class="btn-logout" onclick="logoutPiket()"><i class="bi bi-box-arrow-right"></i> Keluar</button>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="piket-content">

    <!-- Form Catat Izin -->
    <div class="piket-card">
      <div class="piket-card-title"><i class="bi bi-calendar-plus"></i> Catat Izin / Sakit Guru</div>
      <form id="form-izin">
        <div class="piket-form-row">
          <label>
            Nama Guru
            <select id="izin-guru" required></select>
          </label>
          <label>
            Jenis
            <select id="izin-jenis">
              <option>Izin</option>
              <option>Sakit</option>
              <option>Kegiatan</option>
              <option>Cuti</option>
            </select>
          </label>
        </div>
        <div class="piket-form-row">
          <label>
            Dari Tanggal
            <input type="date" id="izin-tanggal" required>
          </label>
          <label>
            Sampai Tanggal
            <input type="date" id="izin-tanggal-sampai">
          </label>
        </div>

        <!-- Checkbox izin parsial -->
        <div class="piket-cb-row" id="wrap-cb-parsial" style="display:none;">
          <label>
            <input type="checkbox" id="izin-parsial">
            Izin sebagian jam saja (bukan seharian penuh)
          </label>
        </div>

        <!-- Preset jam pelajaran -->
        <div id="wrap-jam-parsial" style="display:none;">
          <div class="piket-preset-wrap">
            <div class="piket-preset-label">Pilihan cepat — klik untuk mengisi jam otomatis:</div>
            <div class="piket-preset-grid" id="preset-jam-pelajaran"></div>
          </div>
          <div class="piket-form-row">
            <label>
              Jam Mulai
              <input type="time" id="izin-jam-mulai">
            </label>
            <label>
              Jam Selesai
              <input type="time" id="izin-jam-selesai">
            </label>
          </div>
        </div>

        <div class="piket-form-row">
          <label>
            Keterangan
            <span class="label-hint">Opsional</span>
            <input type="text" id="izin-keterangan" placeholder="Contoh: Rapat dinas luar">
          </label>
        </div>

        <button type="submit" class="btn-piket"><i class="bi bi-save"></i> Simpan Izin</button>
      </form>
    </div>

    <!-- Riwayat Izin (hanya data milik akun piket ini) -->
    <div class="piket-card">
      <div class="piket-card-title"><i class="bi bi-list-ul"></i> Riwayat Izin <span
          style="font-size:13px; font-weight:400; color:var(--muted); margin-left:8px;">(dicatat oleh Anda)</span></div>
      <div class="piket-table-wrap">
        <table class="piket-table">
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Nama Guru</th>
              <th>Jenis</th>
              <th>Keterangan</th>
            </tr>
          </thead>
          <tbody id="tbody-izin">
            <tr>
              <td colspan="4">Memuat…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="piket-pagination">
        <span class="page-info" id="info-halaman">-</span>
        <div class="page-btns">
          <button type="button" class="btn-piket-secondary" id="btn-prev"><i class="bi bi-chevron-left"></i>
            Sebelumnya</button>
          <button type="button" class="btn-piket-secondary" id="btn-next">Selanjutnya <i
              class="bi bi-chevron-right"></i></button>
        </div>
      </div>
    </div>

  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="piket-footer">
    <span>MA Bi'rul Ulum @2026 dikembangkan oleh <a href="https://www.instagram.com/aflah.design/" target="_blank">@aflah.design</a></span>
  </footer>

</body>
